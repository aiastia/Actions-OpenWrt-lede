name: Build OpenWrt neww

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

  schedule:
    - cron: '0 21 */2 * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

    - name: Maximize Build Space
      uses: justinthelaw/maximize-github-runner-space@v0.8.0
      with:
        cleanup-profile: custom
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"
        remove-docker-images: "true"
        swapfile-size: 8G

    - name: Checkout
      uses: actions/checkout@v6

    - name: Disk space
      run: |
        echo "Free space:"
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt clean
        sudo rm -rf /var/cache/apt/archives/*
        df -h

        # 将 apt 缓存目录指向 /workdir，避免占用根文件系统空间
        sudo mkdir -p /workdir/apt-cache
        sudo sh -c 'echo "Dir::Cache::Archives \"/workdir/apt-cache\";" > /etc/apt/apt.conf.d/99workdir-cache'

        sudo dpkg --configure -a || true
        sudo apt -f install -y || true

        sudo apt update -y
        
        # sudo apt install --no-install-recommends -y \
        #   build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
        #   git libncurses5-dev libssl-dev python3 python3-pyelftools \
        #   python3-setuptools rsync unzip zlib1g-dev file wget curl qemu-utils ccache \
        #   libelf-dev libtool pkgconf


        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
        genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
        python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
        swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

        # 清理 apt 缓存和临时配置
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /workdir/apt-cache
        sudo rm -f /etc/apt/apt.conf.d/99workdir-cache
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache OpenWrt ccache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Cache OpenWrt dl
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/openwrt/dl
          !${{ github.workspace }}/openwrt/dl/go-mod-cache
          ${{ github.workspace }}/openwrt/tmp/go-build
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('openwrt/feeds.conf', 'openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        # 清理 feeds 和索引
        #rm -rf tmp
        #rm -rf staging_dir
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Show passwall version info
      run: |
        cd openwrt
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  PassWall 版本追踪（详细）"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📦 各 feed 中 luci-app-passwall 的版本："
        for feed_dir in feeds/*/luci-app-passwall; do
          if [ -d "$feed_dir" ]; then
            FEED_NAME=$(echo "$feed_dir" | cut -d'/' -f2)
            VERSION=$(grep '^PKG_VERSION' "$feed_dir/Makefile" 2>/dev/null | head -1)
            RELEASE=$(grep '^PKG_RELEASE' "$feed_dir/Makefile" 2>/dev/null | head -1)
            COMMIT=$(cd "$feed_dir" && git log --oneline -1 2>/dev/null || echo "N/A")
            echo "  [$FEED_NAME] $VERSION $RELEASE"
            echo "    最后提交: $COMMIT"
          fi
        done
        echo ""
        echo "🔗 package/ 中所有 passwall 相关内容："
        find package/ -maxdepth 2 -name "*passwall*" -o -name "*Passwall*" 2>/dev/null | head -20
        echo ""
        echo "  符号链接检查："
        for d in package/*passwall* package/**/*passwall*; do
          if [ -L "$d" ]; then
            echo "  $d -> $(readlink $d)"
          fi
        done 2>/dev/null
        echo ""
        echo "📂 lede 源码 package/ 目录中的 passwall："
        find package/lean package/ctcgfw package/openwrt -maxdepth 1 -name "*passwall*" 2>/dev/null || echo "  (无)"
        echo ""
        echo "📋 feeds install 日志中 passwall 相关信息："
        grep -i "passwall" tmp/.feedsinfo 2>/dev/null | head -10 || echo "  (无 feedsinfo)"
        echo ""
        echo "🔍 所有 feeds 中 passwall 的优先级（index 文件）："
        for feed in feeds/*/index; do
          if [ -f "$feed" ]; then
            FEED_NAME=$(echo "$feed" | cut -d'/' -f2)
            grep "passwall" "$feed" 2>/dev/null | head -3 && echo "  ↑ 来自 [$FEED_NAME]"
          fi
        done
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: luci-theme-argon
      run: |
        cd openwrt/package
        git clone https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon

    - name: Download AdGuardHome binary
      run: |
        ADG_VERSION="v0.107.73"
        ADG_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADG_VERSION}/AdGuardHome_linux_amd64.tar.gz"
        echo "正在下载 AdGuardHome ${ADG_VERSION} ..."
        curl -fsSL -o /tmp/AdGuardHome.tar.gz "${ADG_URL}"
        tar -xzf /tmp/AdGuardHome.tar.gz -C /tmp
        mkdir -p files/usr/bin
        cp /tmp/AdGuardHome/AdGuardHome files/usr/bin/AdGuardHome
        chmod +x files/usr/bin/AdGuardHome
        echo "AdGuardHome 二进制文件已准备好: $(file files/usr/bin/AdGuardHome)"
        rm -rf /tmp/AdGuardHome /tmp/AdGuardHome.tar.gz

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
      
    - name: Show and Save OpenWrt Configuration
      run: |
        cd openwrt
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  OpenWrt 构建配置详细信息"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # 1. 显示目标设备信息
        echo "🎯 目标设备："
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/'
        
        # 2. 显示分区大小（最关键）
        echo ""
        echo "📏 分区配置："
        grep -E "^CONFIG_TARGET_(ROOTFS|KERNEL)_PARTSIZE" .config || echo "❌ 未找到分区配置！"
        
        # 3. 显示文件系统配置
        echo ""
        echo "💾 文件系统类型："
        grep "CONFIG_TARGET_ROOTFS" .config
        
        # 4. 显示关键软件包
        echo ""
        echo "📦 关键软件包："
        for pkg in luci-app-passwall sing-box xray v2ray-core; do
          if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
            echo "✅ ${pkg} 已启用"
          else
            echo "❌ ${pkg} 未启用"
          fi
        done
        
        # 5. 生成 diffconfig（最小化配置）
        ./scripts/diffconfig.sh > $GITHUB_WORKSPACE/config-diff.txt
        
        # 6. 复制完整配置
        cp .config $GITHUB_WORKSPACE/openwrt-config.txt
        
        # 7. 显示统计信息
        echo ""
        echo "📊 配置统计："
        echo "   - 总配置项：$(wc -l < .config)"
        echo "   - 自定义项：$(wc -l < $GITHUB_WORKSPACE/config-diff.txt)"
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # 8. 显示 diffconfig 内容
        echo "config-diff.txt 内容："
        cat $GITHUB_WORKSPACE/config-diff.txt
      
    - name: Upload configuration artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openwrt-configuration
        path: |
          openwrt-config.txt
          config-diff.txt
        retention-days: 7

    - name: Clean Go module cache
      run: |
        rm -rf openwrt/dl/go-mod-cache
        echo "Go module cache cleaned"

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete releases and workflows runs
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        delete_releases: true
        releases_keep_latest: 10
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 1
        gh_token: ${{ secrets.GITHUB_TOKEN }}
